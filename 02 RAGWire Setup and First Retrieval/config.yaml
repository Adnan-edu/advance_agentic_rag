embeddings:
  # OpenRouter does not provide embeddings. Keep them local and free.
  provider: "fastembed"
  model_name: "BAAI/bge-base-en-v1.5"

llm:
  # OpenRouter uses LangChain's OpenAI-compatible transport internally.
  provider: "openrouter"
  model_tier: "free"  # Default; override with RAGWire(..., model_tier="paid").
  model_options:
    # NVIDIA may log free-endpoint prompts; use public/non-sensitive documents only.
    free: "nvidia/nemotron-3-super-120b-a12b:free"
    paid: "nex-agi/nex-n2-mini"
  api_key: "${OPENROUTER_API_KEY}"
  base_url: "https://openrouter.ai/api/v1"
  max_retries: 6  # Mitigates transient shared-pool 429/5xx errors; not a reliability guarantee.

vectorstore:
  url: "http://localhost:6333"
  # A new name avoids mixing vectors produced by a different embedding model.
  collection_name: "finance-rag-bge-base-openrouter"
  use_sparse: true
  force_recreate: false

retriever:
  search_type: "hybrid"
  top_k: 5
  auto_filter: false   # set true to enable LLM-based filter extraction from every query


metadata:
  config_file: "finance_metadata.yaml"   # Custom fields (see Custom Metadata docs)
  fail_on_extraction_error: true          # Never store finance chunks without filter metadata.
  # If config_file is omitted, fields default to:
  # company_name, doc_type, fiscal_quarter, fiscal_year
