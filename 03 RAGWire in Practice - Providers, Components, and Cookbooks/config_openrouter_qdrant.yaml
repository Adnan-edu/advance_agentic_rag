embeddings:
  # Match Lesson 02 and the existing local collection; no embedding API calls.
  provider: "fastembed"
  model_name: "BAAI/bge-base-en-v1.5"

llm:
  provider: "openrouter"
  model_tier: "free"  # Override explicitly with RAGWire(..., model_tier="paid").
  model_options:
    # NVIDIA free endpoints may log prompts. Use public, non-sensitive documents only.
    free: "nvidia/nemotron-3-super-120b-a12b:free"
    paid: "nex-agi/nex-n2-mini"
  api_key: "${OPENROUTER_API_KEY}"
  base_url: "https://openrouter.ai/api/v1"
  max_retries: 6

vectorstore:
  # Local Qdrant started by ../start_qdrant.sh from this lesson directory.
  url: "http://localhost:6333"
  collection_name: "finance-rag-bge-base-openrouter"
  use_sparse: true
  force_recreate: false
  ingest_batch_size: 50
  timeout: 300

retriever:
  search_type: "hybrid"
  top_k: 5
  auto_filter: false

metadata:
  config_file: "finance_metadata.yaml"
  fail_on_extraction_error: true

logging:
  level: "INFO"
  console_output: true
  colored: false
  log_file: "./.log/ragwire.log"
