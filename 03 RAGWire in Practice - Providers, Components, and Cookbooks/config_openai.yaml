embeddings:
  provider: "openai"
  model: "text-embedding-3-small"   # 1536-dim, best price/performance
  api_key: "${OPENAI_API_KEY}"

llm:
  provider: "openai"
  model: "gpt-5.4-nano"             # Latest — fast, affordable, good for metadata extraction
  api_key: "${OPENAI_API_KEY}"

vectorstore:
  url: "http://localhost:6333"
  collection_name: "finance-rag-openai"
  use_sparse: true
  force_recreate: false

retriever:
  search_type: "hybrid"
  top_k: 5
  auto_filter: true   # set true to enable LLM-based filter extraction from every query


metadata:
  config_file: "finance_metadata.yaml"   # Custom fields (see Custom Metadata docs)
                                 # If omitted, defaults to: company_name,
                                 # doc_type, fiscal_quarter, fiscal_year

logging:
  level: "INFO"  # "DEBUG" | "INFO" | "WARNING" | "ERROR" | "CRITICAL"
  console_output: true  # true | false
  colored: false  # true | false
  log_file: "./.log/ragwire.log"
