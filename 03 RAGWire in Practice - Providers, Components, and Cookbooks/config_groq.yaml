embeddings:
  provider: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"

llm:
  provider: "groq"
  model: "qwen/qwen3-32b"            # Latest — fast, affordable, good for metadata extraction
  api_key: "${GROQ_API_KEY}"

vectorstore:
  url: "http://localhost:6333"
  collection_name: "finance-rag-groq"
  use_sparse: true
  force_recreate: true

retriever:
  search_type: "hybrid"
  top_k: 5
  auto_filter: true   # set true to enable LLM-based filter extraction from every query


metadata:
  config_file: "finance_metadata.yaml"   # Custom fields (see Custom Metadata docs)
                                 # If omitted, defaults to: company_name,
                                 # doc_type, fiscal_quarter, fiscal_year

logging:
  level: "INFO"  # "DEBUG" | "INFO" | "WARNING" | "ERROR" | "CRITICAL"
  console_output: true  # true | false
  colored: false  # true | false
  log_file: "./.log/ragwire.log"
