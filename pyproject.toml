[project]
name = "ragwire"
version = "1.2.9"
description = "RAGWire — Production-grade RAG toolkit for document ingestion and retrieval with hybrid search support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    "chainlit>=2.11.1",
    "crewai>=1.6.1",
    "fastembed>=0.2.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.0.0",
    "langchain-community>=0.0.0",
    "langchain-core>=0.1.0",
    "langchain-google-genai>=0.0.0",
    "langchain-groq>=0.0.0",
    "langchain-huggingface>=0.0.0",
    "langchain-ollama>=0.0.0",
    "langchain-openai>=0.0.0",
    "langchain-qdrant>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "markdown2>=2.5.4",
    "markitdown[pdf]>=0.0.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tqdm>=4.66.0",
    "xhtml2pdf>=0.2.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragwire*"]
namespaces = false

[dependency-groups]
dev = ["ipykernel>=6.29"]
