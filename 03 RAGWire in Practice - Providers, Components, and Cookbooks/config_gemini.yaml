embeddings:
  provider: "google"
  model: "models/gemini-embedding-001"   # Stable, recommended for production
  api_key: "${GOOGLE_API_KEY}"

llm:
  provider: "google"
  model: "gemini-2.5-flash"              # Best price/performance
  api_key: "${GOOGLE_API_KEY}"

vectorstore:
  url: "http://localhost:6333"
  collection_name: "finance-rag-google"
  use_sparse: true
  force_recreate: true

retriever:
  search_type: "hybrid"
  top_k: 5
  auto_filter: true   # set true to enable LLM-based filter extraction from every query


metadata:
  config_file: "finance_metadata.yaml"   # Custom fields (see Custom Metadata docs)
                                 # If omitted, defaults to: company_name,
                                 # doc_type, fiscal_quarter, fiscal_year

logging:
  level: "INFO"  # "DEBUG" | "INFO" | "WARNING" | "ERROR" | "CRITICAL"
  console_output: true  # true | false
  colored: false  # true | false
  log_file: "./.log/ragwire.log"
