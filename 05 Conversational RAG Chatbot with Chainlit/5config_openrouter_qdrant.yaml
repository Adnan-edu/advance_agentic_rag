embeddings:
  provider: "huggingface"                # Local sentence-transformers via langchain-huggingface
  model_name: "BAAI/bge-m3"              # Multilingual, 1024-dim, strong retrieval baseline
  model_kwargs:
    device: "cpu"                        # set "cuda" or "mps" if you have a GPU
  encode_kwargs:
    normalize_embeddings: true           # cosine-friendly; recommended for BGE family

llm:
  provider: "openrouter"
  model_tier: "free"
  model_options:
    # NVIDIA free endpoints may log prompts. Use public, non-sensitive documents only.
    free: "nvidia/nemotron-3-super-120b-a12b:free"
    paid: "nex-agi/nex-n2-mini"
  api_key: "${OPENROUTER_API_KEY}"
  base_url: "https://openrouter.ai/api/v1"
  max_retries: 6

vectorstore:
  url: "http://localhost:6333"
  collection_name: "finance-rag-qdrant"
  use_sparse: true
  force_recreate: false

retriever:
  search_type: "hybrid" # "similarity" | "mmr" | "hybrid"
  top_k: 5
  auto_filter: false   # set true to enable LLM-based filter extraction from every query


metadata:
  config_file: "finance_metadata.yaml"   # Custom fields (see Custom Metadata docs)
  fail_on_extraction_error: true          # Never store finance chunks without filter metadata.
                                 # If omitted, defaults to: company_name,
                                 # doc_type, fiscal_quarter, fiscal_year

logging:
  level: "INFO"  # "DEBUG" | "INFO" | "WARNING" | "ERROR" | "CRITICAL"
  console_output: true  # true | false
  colored: false  # true | false
  log_file: "./.log/ragwire.log"
